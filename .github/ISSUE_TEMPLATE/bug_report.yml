name: Bug report
description: Reproduce a failure in an existing capability
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      options:
        - CPU
        - Memory and cartridge
        - Bus and I/O
        - Timing and peripherals
        - Video
        - Audio
        - SDL frontend
        - Build and CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: State what happened, including the failing assertion or observable result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact build, test or instruction sequence; provide a minimal legal fixture when possible.
      placeholder: "Commands, input, expected and actual output"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and source
      description: Link the relevant hardware specification, contract or established test.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Commit, compiler, OS, runtime arguments, logs and test artifacts.
  - type: textarea
    id: regression
    attributes:
      label: Proposed regression check
      description: The assertion that would fail before a fix and pass afterward.

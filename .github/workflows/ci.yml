name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc-debug, os: ubuntu-24.04, preset: default, configuration: Debug, cc: gcc, cxx: g++ }
          - { name: linux-gcc-release, os: ubuntu-24.04, preset: default, configuration: Release, cc: gcc, cxx: g++ }
          - { name: linux-clang-debug, os: ubuntu-24.04, preset: default, configuration: Debug, cc: clang, cxx: clang++ }
          - { name: linux-clang-release, os: ubuntu-24.04, preset: default, configuration: Release, cc: clang, cxx: clang++ }
          - { name: windows-debug, os: windows-2022, preset: windows, configuration: Debug, cc: cl, cxx: cl }
          - { name: windows-release, os: windows-2022, preset: windows, configuration: Release, cc: cl, cxx: cl }
          - { name: macos-debug, os: macos-26, preset: default, configuration: Debug, cc: clang, cxx: clang++ }
          - { name: macos-release, os: macos-26, preset: default, configuration: Release, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libltdl-dev
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: b2c74683ecfd6a8e7d27ffb0df077f66a9339509
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.configuration }} --parallel 3
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --build-config ${{ matrix.configuration }} --output-on-failure
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: tests-${{ matrix.name }}
          path: build/*/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  static-analysis:
    name: Clang-tidy
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install analysis tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy libltdl-dev
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: b2c74683ecfd6a8e7d27ffb0df077f66a9339509
      - name: Configure
        run: cmake --preset default -DCMAKE_BUILD_TYPE=Debug
      - name: Run clang-tidy
        run: clang-tidy -p build/default src/core/bus/bus.cpp src/core/cpu/arm7tdmi.cpp src/core/mmu/mmu.cpp src/core/io/io.cpp apps/sdl/main.cpp

  sanitizers:
    name: Sanitizer / ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build libltdl-dev
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: b2c74683ecfd6a8e7d27ffb0df077f66a9339509
      - name: Configure with sanitizer
        run: >
          cmake --preset default -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"
      - name: Build
        run: cmake --build --preset default --parallel 3
      - name: Test
        run: ctest --preset default --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:symbolize=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install coverage tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build lcov libltdl-dev
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: b2c74683ecfd6a8e7d27ffb0df077f66a9339509
      - name: Configure with instrumentation
        run: >
          cmake --preset default -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="--coverage"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build
        run: cmake --build --preset default --parallel 3
      - name: Test
        run: ctest --preset default --output-on-failure
      - name: Collect coverage
        run: |
          lcov --capture --directory build/default/CMakeFiles/gba_core.dir --output-file coverage.raw.info
          lcov --remove coverage.raw.info '/usr/*' --output-file coverage.info
          lcov --list coverage.info
      - name: Upload coverage
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: coverage-report
          path: coverage.info

  docs-check:
    name: Repository consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check required files and presets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for name in ["README.md", "docs/BUILDING.md", "docs/TESTING.md",
                       "docs/TECHNICAL_OVERVIEW.md", "tests/README.md"]:
              if not Path(name).is_file():
                  raise SystemExit(f"Missing {name}")
          data = json.loads(Path("CMakePresets.json").read_text())
          for category in ("configurePresets", "buildPresets", "testPresets"):
              names = {preset["name"] for preset in data[category]}
              if not {"default", "windows"} <= names:
                  raise SystemExit(f"Missing {category} entries: {names}")
          PY

  quality-gate:
    name: Quality Gate
    if: always()
    needs: [build, static-analysis, sanitizers, coverage, docs-check]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all verification jobs
        env:
          BUILD: ${{ needs.build.result }}
          ANALYSIS: ${{ needs.static-analysis.result }}
          SANITIZERS: ${{ needs.sanitizers.result }}
          COVERAGE: ${{ needs.coverage.result }}
          DOCS: ${{ needs.docs-check.result }}
        run: |
          for result in "$BUILD" "$ANALYSIS" "$SANITIZERS" "$COVERAGE" "$DOCS"; do
            if [ "$result" != success ]; then
              printf 'A required CI job did not succeed: %s\n' "$result" >&2
              exit 1
            fi
          done
